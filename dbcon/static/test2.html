<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pie Chart Example</title>
    <style>
        .slice-text {
            text-anchor: middle;
            dominant-baseline: middle;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .legend-item {
            font-family: Arial, sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div id="pie-container"></div>

<script>
    const pieContainer = document.getElementById('pie-container');
    const width = 500;
    const height = 400;
    const margin = 60;

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    pieContainer.appendChild(svg);

    // Colors for each slice
    const colors = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#121212'];

    function createPieChart(dataValues, dataLabels, colors) {
        const radius = Math.min(width - margin * 2, height - margin * 2) / 2;
        const centerX = width / 2;
        const centerY = height / 2;

        // Total value for percentage calculation
        const totalValue = dataValues.reduce((acc, val) => acc + val, 0);

        let currentAngle = 0;

        // Create the pie slices and track positions for pointers
        const slicePositions = [];
        dataValues.forEach((value, index) => {
            const percent = (value / totalValue) * 100;
            const angle = (percent / 100) * 2 * Math.PI;

            const slice = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const arc = [
                `M ${centerX} ${centerY}`,
                `L ${centerX + radius * Math.cos(currentAngle)} ${centerY + radius * Math.sin(currentAngle)}`,
                `A ${radius} ${radius} 0 ${(angle > Math.PI ? 1 : 0)} 1 ${centerX + radius * Math.cos(currentAngle + angle)} ${centerY + radius *
                Math.sin(currentAngle + angle)}`,
                `L ${centerX} ${centerY}`
            ].join(' ');

            slice.setAttribute('d', arc);
            slice.style.fill = colors[index % colors.length];
            svg.appendChild(slice);

            // Add text label to the slice
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            const midAngle = currentAngle + angle / 2;
            const textX = centerX + (radius * 0.8) * Math.cos(midAngle);
            const textY = centerY + (radius * 0.8) * Math.sin(midAngle);

            text.setAttribute('x', textX);
            text.setAttribute('y', textY);
            text.setAttribute('class', 'slice-text');
            text.textContent = `${dataLabels[index]}: ${value.toLocaleString()}`;
            svg.appendChild(text);

            slicePositions.push({ x: centerX + radius * Math.cos(midAngle), y: centerY + radius * Math.sin(midAngle) });

            currentAngle += angle;
        });

        // Create the legend
        const legendX = width - margin - 100;
        let legendY = height / 2;

        dataValues.forEach((value, index) => {
            // Add colored rectangle
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', legendX - 20);
            rect.setAttribute('y', legendY - 10);
            rect.setAttribute('width', '20');
            rect.setAttribute('height', '20');
            rect.style.fill = colors[index % colors.length];
            svg.appendChild(rect);

            // Add text
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', legendX);
            text.setAttribute('y', legendY + 5);
            text.setAttribute('class', 'legend-item');
            text.textContent = dataLabels[index];
            svg.appendChild(text);

            // Add connecting line
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', legendX - 15);
            line.setAttribute('y1', legendY);
            line.setAttribute('x2', slicePositions[index].x);
            line.setAttribute('y2', slicePositions[index].y);
            line.style.stroke = colors[index % colors.length];
            line.style.strokeWidth = '1';
            svg.appendChild(line);

            legendY += 30;
        });
    }

    // Sample data
    const dataValues = [5165, 422, 354, 258, 141];
    const dataLabels = ['Category A', 'Category B', 'Category C', 'Category D', 'E'];

    createPieChart(dataValues, dataLabels, colors);
</script>
</body>
</html>
