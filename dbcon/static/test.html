<!DOCTYPE html>
<html>
<head>
    <style>
        .chart-container {
            margin: 20px;
        }

        .slice {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slice:hover {
            opacity: 0.8;
        }

        .legend-item rect {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        .legend-item text {
            font-size: 12px;
            dominant-baseline: middle;
        }
    </style>
</head>
<body>
<div class="chart-container"></div>

<script>
    function drawPieChart(data, total, container) {
        // Set chart dimensions
        const width = 500;
        const height = 500;
        const margin = 0;
        const chartWidth = width - 2 * margin;
        const chartHeight = height - 2 * margin;

        // Create SVG element
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute('width', width+300);
        svg.setAttribute('height', height);
        container.appendChild(svg);

        // Calculate totals
        if (!total) {
            total = data.reduce((sum, item) => sum + item.value, 0);
        }

        console.log(total);

        // Create pie chart slices
        let currentAngle = 0;
        const centerX = margin + chartWidth / 2;
        const centerY = margin + chartHeight / 2;

        const radius = Math.min(chartWidth - margin * 2, chartHeight - margin * 2) / 2;

        data.forEach(item => {
            const percent = (item.value / total) * 100;
            const angle = (percent / 100) * 2 * Math.PI;

            // Create slice path
            const slice = document.createElementNS("http://www.w3.org/2000/svg", "path");
            slice.classList.add("slice");

            const d = [
                `M ${centerX} ${centerY}`,
                `L ${centerX + radius * Math.cos(currentAngle)} ${centerY + radius * Math.sin(currentAngle)}`,
                `A ${radius} ${radius} 0 ${(angle > Math.PI ? 1 : 0)} 1 ${centerX + radius * Math.cos(currentAngle + angle)} ${centerY + radius *
                Math.sin(currentAngle + angle)}`,
                `L ${centerX} ${centerY}`
            ].join(' ');

            slice.setAttributeNS(null, 'd', d);
            slice.style.fill = item.color;

            // Add title (tooltip)
            const tooltip = document.createElementNS("http://www.w3.org/2000/svg", "title");
            tooltip.textContent = `${item.label}: ${percent.toFixed(1)}%`;
            slice.appendChild(tooltip);

            svg.appendChild(slice);

            currentAngle += angle;
        });

        // Add legend
        const legendG = document.createElementNS("http://www.w3.org/2000/svg", "g");
        legendG.setAttribute('transform', `translate(520,${margin})`);

        data.forEach((item, index) => {
            const legendItem = document.createElementNS("http://www.w3.org/2000/svg", 'g');
            legendItem.classList.add('legend-item');

            // Legend color swatch
            const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            rect.setAttributeNS(null, 'x', 0);
            rect.setAttributeNS(null, 'y', index * 20);
            rect.style.fill = item.color;

            // Legend text
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttributeNS(null, 'x', 24);
            text.setAttributeNS(null, 'y', index * 20 + 12);
            text.textContent = item.label + ': ' + item.value;

            legendItem.appendChild(rect);
            legendItem.appendChild(text);
            legendG.appendChild(legendItem);
        });

        svg.appendChild(legendG);
    }

    // Sample data
    const data = [
        { label: 'Chrome', value: 42, color: '#3C87E0' },
        { label: 'Firefox', value: 25, color: '#FF9B2A' },
        { label: 'Safari', value: 15, color: '#007AFF' },
        { label: 'Edge', value: 10, color: '#ED1C24' },
        { label: 'Others', value: 5, color: '#8C8C8C' }
    ];


    drawPieChart(data, 0, document.querySelector('.chart-container'));
</script>
</body>
</html>
